<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>صيدلية دكتورة تغريد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f4;--sf:#fff;--ink:#12302b;--mu:#5b7470;--br:#0f6b5c;--bi:#fff;--wn:#a8500f;--wb:#fdeedd;--bd:#b3261e;--bb:#fde6e4;--ok:#e1f2ec;--ln:#d9e3e0;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a18;--sf:#162724;--ink:#e3f0ec;--mu:#8fa9a3;--br:#3fbfa8;--bi:#08201b;--wn:#f0a15f;--wb:#3a2a18;--bd:#ff8a80;--bb:#3a1c1a;--ok:#1b3a33;--ln:#2a413c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a18;--sf:#162724;--ink:#e3f0ec;--mu:#8fa9a3;--br:#3fbfa8;--bi:#08201b;--wn:#f0a15f;--wb:#3a2a18;--bd:#ff8a80;--bb:#3a1c1a;--ok:#1b3a33;--ln:#2a413c;color-scheme:dark}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.5 Tajawal,"Segoe UI",Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sf);border-bottom:1px solid var(--ln);padding:10px 14px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:20px;font-weight:800;color:var(--br)}
.date{color:var(--mu);font-size:13px}
nav{display:flex;gap:4px;margin-top:8px}
nav button{flex:1;border:0;background:none;color:var(--mu);font:700 13px Tajawal,sans-serif;padding:10px 2px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--br);border-bottom-color:var(--br)}
main{max-width:1000px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:16px;font-weight:800}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--br);outline-offset:1px}
.btn{border:0;border-radius:8px;background:var(--br);color:var(--bi);font:700 15px Tajawal,sans-serif;padding:10px 14px;cursor:pointer}
.btn.sec{background:var(--ok);color:var(--br)}
.btn.del{background:var(--bb);color:var(--bd)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.nm{font-weight:700}
.sub{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;margin-inline-start:4px}
.tag.w{background:var(--wb);color:var(--wn)}.tag.b{background:var(--bb);color:var(--bd)}.tag.g{background:var(--ok);color:var(--br)}
.pos{display:grid;gap:12px}
@media(min-width:760px){.pos{grid-template-columns:1.2fr 1fr;align-items:start}.cartc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px)}.bar{display:none!important}}
.q{display:flex;align-items:center;gap:6px}
.q button{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:700 18px sans-serif;cursor:pointer}
.tot{display:flex;justify-content:space-between;padding:6px 0}
.tot.big{font-size:20px;font-weight:800;color:var(--br)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px}
.st b{display:block;font-size:22px;font-weight:800}
.st span{color:var(--mu);font-size:13px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .full{grid-column:1/-1}
.form label{font-size:13px;color:var(--mu)}
.bar{position:fixed;inset-inline:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--ln);z-index:9}
.bar .btn{width:100%}
.empty{color:var(--mu);text-align:center;padding:18px 0}
.add{display:flex;gap:6px;align-items:center}.add input{width:70px;padding:7px}
.toast{position:fixed;inset-inline:14px;bottom:80px;background:var(--br);color:var(--bi);padding:12px;border-radius:10px;text-align:center;font-weight:700;z-index:20}
.scanrow{display:flex;gap:6px;margin-bottom:8px}.scanrow .btn{white-space:nowrap;padding:8px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.md{background:var(--sf);border-radius:12px;padding:16px;width:100%;max-width:380px;max-height:90%;overflow:auto}
.ov.lock{background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.toast{z-index:40}
nav{overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{white-space:nowrap;padding-inline:10px}
.chips.nowrap{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.chips.nowrap .btn{white-space:nowrap;padding:7px 12px;font-size:14px}
.dash{display:grid;gap:12px;margin-bottom:12px}@media(min-width:760px){.dash{grid-template-columns:1fr 1fr}}.dash .card{margin:0;min-width:0}
.bars{display:flex;align-items:flex-end;gap:3px;height:160px;border-bottom:1px solid var(--ln)}.bars>div{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;gap:1px}
.bars i{flex:1;display:block;min-height:1px;border-radius:3px 3px 0 0}.bars i.s{background:var(--br)}.bars i.p{background:var(--wn)}
.lbls{display:flex;gap:3px;margin-top:4px}.lbls span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--mu);white-space:nowrap}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mu);margin-top:8px}.lg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
.hb{display:grid;grid-template-columns:minmax(70px,1.3fr) 2fr auto;gap:8px;align-items:center;padding:5px 0;font-size:14px}.hb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{height:10px;border-radius:99px;background:var(--ok);overflow:hidden;display:block}.hb .t i{display:block;height:100%;background:var(--br);border-radius:99px}.hb b{font-size:13px;white-space:nowrap}
.dl{display:block;font-size:12px;margin-top:2px;color:var(--mu)}.dl.u{color:var(--br)}.dl.d{color:var(--bd)}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--wb)}.split i{display:block;background:var(--br)}
.ins{margin:0;padding:0;list-style:none}.ins li{padding:7px 0;border-bottom:1px solid var(--ln)}.ins li:last-child{border:0}
body{background:linear-gradient(180deg,var(--ok) 0,transparent 300px) no-repeat,var(--bg)}
header{box-shadow:0 2px 12px rgba(18,48,43,.06)}
h1{display:flex;align-items:center;gap:6px;white-space:nowrap}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes grow-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes toastin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#app.enter>*{animation:up .38s cubic-bezier(.2,.7,.2,1) backwards}
#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}#app.enter>*:nth-child(4){animation-delay:.15s}#app.enter>*:nth-child(5){animation-delay:.2s}#app.enter>*:nth-child(n+6){animation-delay:.25s}
#app.enter .stats>.st{animation:up .4s cubic-bezier(.2,.7,.2,1) backwards}
#app.enter .stats>.st:nth-child(2){animation-delay:.04s}#app.enter .stats>.st:nth-child(3){animation-delay:.08s}#app.enter .stats>.st:nth-child(4){animation-delay:.12s}#app.enter .stats>.st:nth-child(n+5){animation-delay:.16s}
#app.enter .bars i{transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) backwards .15s}
#app.enter .hb .t i,#app.enter .split i{transform-origin:right;animation:grow-x .7s cubic-bezier(.2,.7,.2,1) backwards .15s}
.ov{animation:fade .18s ease}.md{animation:pop .24s cubic-bezier(.2,.8,.3,1.05)}
.toast{animation:toastin .26s ease}
.btn,nav button,.st,.card,.row{transition:transform .14s ease,box-shadow .22s ease,background-color .2s ease,filter .2s ease,color .2s ease,border-color .2s ease}
.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 5px 14px rgba(15,107,92,.22)}
.btn:active:not(:disabled){transform:scale(.96);box-shadow:none}
nav button:hover{color:var(--ink)}nav button:active{transform:scale(.95)}
.card:hover{box-shadow:0 6px 20px rgba(18,48,43,.07)}.st:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(18,48,43,.08)}
.row{margin-inline:-6px;padding-inline:6px;border-radius:8px}.row:hover{background:var(--ok)}
.q button{transition:transform .12s ease,background-color .2s}.q button:active{transform:scale(.88)}
input,select{transition:border-color .2s,box-shadow .2s}input:focus,select:focus{border-color:var(--br);box-shadow:0 0 0 3px rgba(15,107,92,.14)}
.rcpt{background:#fff;color:#111;border-radius:8px;padding:16px 16px 14px;font-size:13px;line-height:1.55;box-shadow:0 4px 20px rgba(0,0,0,.14);animation:up .35s cubic-bezier(.2,.7,.2,1)}
.rcpt .rh{text-align:center;padding-bottom:6px}.rcpt .rlogo{font-size:28px;line-height:1}
.rcpt .rname{font-size:20px;font-weight:800;margin-top:2px}.rcpt .raddr{font-size:12px;color:#444;margin-top:2px}
.rcpt .rl{border-top:1.5px dashed #999;margin:9px 0}
.rcpt .rm{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#333;padding:1px 0}.rcpt .rm b{color:#111}
.rcpt .rc{display:flex;justify-content:space-between;font-weight:800;font-size:12px;color:#333;padding-bottom:2px}
.rcpt .ri{padding:6px 0;border-bottom:1px dotted #ccc}.rcpt .ri:last-of-type{border-bottom:0}
.rcpt .rn{font-weight:700}.rcpt .rq{display:flex;justify-content:space-between;color:#333;font-size:12.5px}.rcpt .rq b{color:#111}
.rcpt .rt{display:flex;justify-content:space-between;padding:2px 0}.rcpt .rt.big{font-size:19px;font-weight:800;padding-top:4px}
.rcpt .rf{text-align:center;font-size:12px;color:#333;margin-top:4px}

:root[data-theme=dark] body[data-tab=pos]{--br:#3fbfa8}:root[data-theme=dark] nav button[data-t=pos]{--nc:#3fbfa8}:root[data-theme=dark] body[data-tab=inv]{--br:#6aa7ff}:root[data-theme=dark] nav button[data-t=inv]{--nc:#6aa7ff}:root[data-theme=dark] body[data-tab=buy]{--br:#b79bff}:root[data-theme=dark] nav button[data-t=buy]{--nc:#b79bff}:root[data-theme=dark] body[data-tab=cus]{--br:#ffb066}:root[data-theme=dark] nav button[data-t=cus]{--nc:#ffb066}:root[data-theme=dark] body[data-tab=ana]{--br:#ff8ad0}:root[data-theme=dark] nav button[data-t=ana]{--nc:#ff8ad0}:root[data-theme=dark] body[data-tab=ord]{--br:#ff8a7a}:root[data-theme=dark] nav button[data-t=ord]{--nc:#ff8a7a}:root[data-theme=dark] body[data-tab=rep]{--br:#8fb7cc}:root[data-theme=dark] nav button[data-t=rep]{--nc:#8fb7cc}
@supports (color:color-mix(in srgb,red,blue)){
body{--ok:color-mix(in srgb,var(--br) 13%,var(--sf))}
.btn:hover:not(:disabled){box-shadow:0 5px 14px color-mix(in srgb,var(--br) 30%,transparent)}
input:focus,select:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--br) 20%,transparent)}
nav button.on{background:color-mix(in srgb,var(--nc) 10%,transparent);border-radius:8px 8px 0 0}
}
:root{--k1:#0f9d7a;--k2:#1d5fb8;--k3:#8a3fd1;--k4:#d9730d;--k5:#c0392b;--k6:#0e8aa8}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--k1:#4fd6b4;--k2:#7ab4ff;--k3:#c9a6ff;--k4:#ffb066;--k5:#ff8a7a;--k6:#5fd3ee}}

header::after{content:"";position:absolute;inset:-4px 0 auto;height:4px;background:linear-gradient(90deg,var(--k1),var(--k2),var(--k3),var(--k4),var(--k5));opacity:.9}
nav button{color:var(--mu)}nav button.on{color:var(--nc,var(--br));border-bottom-color:var(--nc,var(--br))}

.stats .st:nth-child(6n+3){border-top-color:var(--k3)}.stats .st:nth-child(6n+3) b{color:var(--k3)}

/* toasts on top */
#toasts{position:fixed;inset-inline:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{position:static!important;inset:auto!important;width:100%;max-width:520px;display:flex;align-items:center;gap:10px;text-align:start;padding:12px 14px;border-radius:12px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-inline-start:6px solid var(--k1);box-shadow:0 10px 28px rgba(0,0,0,.2);font-weight:700;pointer-events:auto;animation:toastdown .28s cubic-bezier(.2,.8,.3,1.05)!important}
.toast::before{content:"✔";flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:#fff;background:var(--k1)}

/* ===== single blue theme v3 ===== */

<script>
/* ===== نسخة العرض (Demo): بتشتغل بدون سيرفر — البيانات بتتخزن في متصفح الزائر بس ===== */
(function(){
"use strict";
const LS=window.localStorage;
const K={state:"phd_state",ver:"phd_ver",users:"phd_users",sess:"phd_sess"};
const jget=(k,d)=>{try{const v=LS.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const jset=(k,v)=>{try{LS.setItem(k,JSON.stringify(v))}catch(e){}};
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("phd|"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return "p|"+s}}

function demoState(){
  const R=rng(20261);const rnd=(a,b)=>a+Math.floor(R()*(b-a+1));const pick=a=>a[Math.floor(R()*a.length)];
  const now=new Date(),dISO=n=>{const d=new Date(now);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
  const C={tab:"دواء (أقراص / كبسولات)",inj:"حقن وأمبولات",syr:"شراب ومعلقات",crm:"كريمات ومراهم",spr:"بخاخات",drp:"نقط (عين / أنف / أذن)",med:"مستلزمات طبية (سرنجات / شاش / قطن)",vit:"مكملات وفيتامينات",soap:"صابون ومنظفات",care:"عناية وتجميل",baby:"أطفال ورضّع (لبن / حفاضات)",dev:"أجهزة طبية (ضغط / سكر / حرارة)"};
  let id=1000;

  const items=[
    IT("بنادول أدفانس 500 مجم",C.tab,38,28,2,24,6,420,"جلاكسو","6221000000011"),
    IT("كونجستال شراب",C.syr,36,27,1,15,5,300,"سيديكو","6221000000028"),
    IT("أوجمنتين 1 جم",C.tab,95,74,2,12,4,380,"جلاكسو","6221000000035"),
    IT("فولتارين إمولجيل",C.crm,62,47,1,9,4,500,"نوفارتس","6221000000042"),
    IT("فيتامين سي 1000 فوار",C.vit,85,62,1,3,5,240,"ايبيكو","6221000000059"),
    IT("نيكسيوم 40 مجم",C.tab,120,92,2,0,4,330,"أسترازينيكا","6221000000066"),
    IT("سرنجة 5 سم (علبة 100)",C.med,90,68,1,6,3,700,"ميديكال","6221000000073"),
    IT("بخاخ فنتولين",C.spr,48,36,1,10,3,260,"جلاكسو","6221000000080"),
    IT("نقط عين ريفريش",C.drp,55,40,1,7,3,48,"أليرجان","6221000000097"),
    IT("كيتوفان 10 مجم",C.tab,30,22,3,18,5,22,"أمون","6221000000103"),
    IT("كريم تفتيح (قديم)",C.care,70,50,1,4,2,-12,"محلي","6221000000110"),
    IT("لبن أطفال رقم 2",C.baby,190,160,1,8,3,200,"نستله","6221000000127"),
    IT("جهاز قياس ضغط ديجيتال",C.dev,650,520,1,3,2,900,"أومرون","6221000000134"),
    IT("بروفين 400 مجم",C.tab,24,17,3,30,8,450,"ابوت","6221000000141"),
    IT("ستربسيلز أقراص مص",C.tab,22,15,1,40,10,400,"ريكيت","6221000000158"),
    IT("صابون ديتول",C.soap,18,12,1,25,8,600,"ريكيت","6221000000165"),
    IT("أمبول فولتارين 75",C.inj,45,32,1,14,5,310,"نوفارتس","6221000000172"),
    IT("كالسيوم + د3",C.vit,110,80,1,11,4,360,"ايبيكو","6221000000189"),
  ];
  const cust=[{id:id++,name:"أحمد محمود",phone:"01001234567",bal:0,log:[]},{id:id++,name:"سارة علي",phone:"01112223334",bal:0,log:[]},{id:id++,name:"الحاج محمد",phone:"01223334445",bal:0,log:[]},{id:id++,name:"أم يوسف",phone:"01554445556",bal:0,log:[]}];
  const sups=[{id:id++,name:"شركة النيل للأدوية",phone:"0233445566",bal:0,log:[]},{id:id++,name:"المتحدة للتوزيع",phone:"0224556677",bal:0,log:[]},{id:id++,name:"الأمل فارما",phone:"0225667788",bal:0,log:[]}];
  const cash=["دكتورة تغريد","منى"];
  const sales=[],log=[];
  for(let back=30;back>=0;back--){
    const n=back===0?rnd(3,6):rnd(6,13);
    for(let k=0;k<n;k++){
      const d=new Date(now);d.setDate(d.getDate()-back);d.setHours(rnd(9,21),rnd(0,59),rnd(0,59),0);
      if(back===0&&d>now)d.setHours(now.getHours()>9?rnd(9,now.getHours()):9,rnd(0,59));
      const nl=rnd(1,3),L=[],used={};
      for(let j=0;j<nl;j++){let it=pick(items);if(used[it.id]||it.qty===0&&R()<.7)continue;used[it.id]=1;
        const st=it.spb>1&&R()<.35;L.push({id:it.id,name:it.name+(st?" ("+(it.sub||"شريط")+")":""),q:st?rnd(1,2):rnd(1,2),price:st?it.sp:it.price,cost:st?it.cost/it.spb:it.cost,st:st?1:0})}

  /* مشتريات الموردين */
  const pur=[];
  [[26,0,[["بنادول أدفانس 500 مجم",40,28],["أوجمنتين 1 جم",20,74]],2000],[18,1,[["كونجستال شراب",30,27],["بروفين 400 مجم",40,17]],1500],[12,2,[["كالسيوم + د3",15,80],["فيتامين سي 1000 فوار",20,62]],0],[7,0,[["نيكسيوم 40 مجم",10,92],["أمبول فولتارين 75",20,32]],1000],[2,2,[["لبن أطفال رقم 2",10,160]],600]]
  .forEach(([bk,si,ls,paid])=>{const sp=sups[si],inv=id++,base=new Date(now);base.setDate(base.getDate()-bk);base.setHours(11,0,0,0);
    const total=ls.reduce((a,l)=>a+l[1]*l[2],0);ls.forEach((l,i)=>{const e={t:new Date(base.getTime()+i).toISOString(),name:l[0],q:l[1],cost:l[2],sup:sp.name,inv};if(i===0)e.paid=paid;pur.push(e)});

  sups[0].bal-=1000;sups[0].log.push({t:Date.now()-864e5*5,a:-1000,n:"سداد"});

/* ---------- سيرفر وهمي داخل المتصفح ---------- */
function J(status,obj){return new Response(JSON.stringify(obj),{status,headers:{"Content-Type":"application/json"}})}
async function ensure(){
  if(!jget(K.users,null))jset(K.users,{"demo":await sha("1234")});
  if(!jget(K.state,null)){jset(K.state,demoState());LS.setItem(K.ver,"1")}
}
function who(h){const a=(h&&(h.Authorization||h.authorization))||"";const t=a.replace(/^Bearer\s+/i,"");const s=jget(K.sess,{});const x=s[t];return x&&x.exp>Date.now()?x.name:null}
const realFetch=window.fetch.bind(window);
window.fetch=async function(input,init){
  const url=typeof input==="string"?input:input.url;let u;try{u=new URL(url,location.href)}catch(e){return realFetch(input,init)}
  if(u.origin!==location.origin||!u.pathname.startsWith("/api/"))return realFetch(input,init);
  await ensure();
  const m=((init&&init.method)||"GET").toUpperCase(),h=(init&&init.headers)||{};let b={};try{b=JSON.parse((init&&init.body)||"{}")}catch(e){}
  const p=u.pathname,users=jget(K.users,{});
  if(p==="/api/status")return J(200,{setup:Object.keys(users).length===0});
  if(p==="/api/login"||p==="/api/setup"){
    const nm=String(b.name||"").trim(),pw=String(b.password||"");
    if(p==="/api/setup"){if(Object.keys(users).length)return J(403,{error:"already set up"});if(!nm||pw.length<4)return J(400,{error:"bad input"});users[nm]=await sha(pw);jset(K.users,users)}
    else if(!users[nm]||users[nm]!==await sha(pw)){await new Promise(r=>setTimeout(r,400));return J(401,{error:"bad login"})}
    const t=Math.random().toString(36).slice(2)+Date.now().toString(36),s=jget(K.sess,{});s[t]={name:nm,exp:Date.now()+12*3600e3};jset(K.sess,s);
    return J(200,{token:t,name:nm});
  }
  const me=who(h);if(!me)return J(401,{error:"auth"});
  if(p==="/api/state"){
    if(m==="GET")return J(200,{version:+LS.getItem(K.ver)||0,state:jget(K.state,null)});
    if(m==="PUT"){const cur=+LS.getItem(K.ver)||0;if(b.version!==cur)return J(409,{version:cur,state:jget(K.state,null)});jset(K.state,b.state);LS.setItem(K.ver,String(cur+1));return J(200,{version:cur+1})}
  }
  if(p==="/api/users"){
    if(m==="GET")return J(200,{users:Object.keys(users).sort()});
    if(m==="POST"){const nm=String(b.name||"").trim(),pw=String(b.password||"");if(!nm||pw.length<4)return J(400,{error:"bad input"});if(users[nm])return J(409,{error:"exists"});users[nm]=await sha(pw);jset(K.users,users);return J(200,{ok:true})}

  }

function merge(b,m,t){

  for(const k of["items","sups","cust"]){

    a.href=URL.createObjectURL(bl);a.download=bk?"pharmacy-backup-"+ds+".json":"pharmacy-"+ds+".xlsx";
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
    toast("تم التحميل ✔ (شوفه في فولدر التنزيلات)");
  }catch(e){toast("فشل التحميل: السيرفر مش شغال أو الاتصال اتقطع. تأكد إن النافذة السودا مفتوحة")}
}
function newCat(sel){
  if(sel.value!=="__new")return;
  const n=(prompt("اكتب اسم القسم الجديد (مثلًا: مراهم جلدية):")||"").trim();
  if(!n){sel.value="";return}
  if(!cats().includes(n)){S.cats.push(n);save()}
  document.querySelectorAll("#ct,#e_ct").forEach(s=>{if(![...s.options].some(o=>o.value===n)){const op=document.createElement("option");op.textContent=n;s.insertBefore(op,s.querySelector('option[value="__new"]'))}});
  sel.value=n;applyAdd();
}
$("#who").onclick=logout;
setTimeout(boot,0);
const menu=o=>{document.body.classList.toggle("menu",o);$("#mbtn").setAttribute("aria-expanded",o)};
$("#mbtn").onclick=()=>menu(!document.body.classList.contains("menu"));$("#mback").onclick=()=>menu(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")menu(false)});
$("#nav").onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;menu(false);render();scrollTo(0,0);if(t==="rep")loadUsers().then(render)}};
$("#app").addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value;render()}
  if(e.target.id==="cq"){cq=e.target.value;render()}
  if(e.target.id==="bq"){bQ=e.target.value;render()}
  if(e.target.id==="iq"){iq=e.target.value;render()}if(e.target.id==="n")autoFillItem();
  if(e.target.closest("#bf"))billTot();
  if(e.target.id==="disc"){disc=Math.min(100,Math.max(0,+e.target.value||0));render();const d=$("#disc");d.focus()}
});
$("#app").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const D=b.dataset,id=D.add||D.inc||D.dec||D.rs||D.del||D.adds,bid=String(id||"").replace(/s$/,"");
  const it=S.items.find(x=>x.id==bid);
  if(D.add||D.inc||D.adds){const st=!!D.adds||String(id).endsWith("s"),k=st?bid+"s":bid;
    const ok=it&&(st?inCart(it)+1<=stripsAvail(it):(cart[bid]||0)<it.qty&&inCart(it)+SPB(it)<=stripsAvail(it));
    if(ok)cart[k]=(cart[k]||0)+1;else if(it)return toast("وصلت لأقصى كمية متاحة")}
  else if(D.dec){cart[id]--;if(cart[id]<=0)delete cart[id]}
  else if(D.addn){const b2=bestBatch(D.addn);if(!b2||(cart[b2.id]||0)>=b2.qty)return toast("مش متاح");cart[b2.id]=(cart[b2.id]||0)+1}
  else if(D.rs){return restockModal(D.rs)}
  else if(D.wo){return woModal(D.wo)}
  else if(D.woall){const x=S.items.find(y=>y.id==D.woall);if(x&&woDo(x,x.qty,"منتهي",true)){save();toast("تم شطب "+x.name)}return}
  else if(D.del){if(!b.dataset.sure){b.dataset.sure=1;b.textContent="تأكيد الحذف";return}logA("حذف صنف: "+(it?it.name+" ("+it.qty+" علبة)":D.del));S.items=S.items.filter(x=>x.id!=id);delete cart[id];delete cart[id+"s"];save();return render()}
  else if(D.badd){$("#bls").insertAdjacentHTML("beforeend",billLine());const r=document.querySelectorAll("#bls .bn");r[r.length-1].focus();return}
  else if(D.bdel){const rs=document.querySelectorAll("#bls .bl");if(rs.length>1)b.closest(".bl").remove();else rs[0].querySelectorAll("input").forEach(x=>x.value="");billTot();return}
  else if(D.cam){return camera()}
  else if(D.stmt){const p=D.stmt.split(":");return stmt(p[0],+p[1])}
  else if(D.dela){if(!b.dataset.sure){b.dataset.sure=1;b.textContent="تأكيد الحذف";return}const p=D.dela.split(":");S[p[0]]=S[p[0]].filter(x=>x.id!=p[1]);save();return render()}
  else if(b.id==="qcust"){return custModal()}
  else if(D.settle){const p=D.settle.split(":");return settle(p[0],+p[1])}
  else if(b.id==="addsup"||b.id==="addcus"){return addAcct(b.id==="addsup"?"sups":"cust")}
  else if(b.id==="clr"){if(!b.dataset.sure){b.dataset.sure=1;b.textContent="دوس تاني للتأكيد: مسح كل الأصناف";setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent="✕ مسح الفاتورة (مش هبيع)"}},3500);return}Object.keys(cart).forEach(k=>delete cart[k]);disc=0;custSel="";render();return note("تم مسح الفاتورة","info")}else if(b.id==="bsave"){return saveBill()}else if(b.id==="closeday"){return doClose()}else if(b.id==="chpw"){return changePw()}
  else if(b.id==="retb"){return retModal()}
  else if(b.id==="addusr"){return addUser()}
  else if(D.delu){logA("حذف مستخدم: "+D.delu);save();api("DELETE","/api/users?name="+encodeURIComponent(D.delu)).then(loadUsers).then(render);return}
  else if(D.rcp!==undefined){return receipt(S.sales[+D.rcp],1)}
  else if(D.of){ordF=D.of;return render()}
  else if(D.bf){bF=D.bf;return render()}
  else if(D.cf){cF=D.cf;return render()}
  else if(D.af){aF=D.af;return render()}
  else if(D.ocopy){return ordCopy()}
  else if(D.owa){return ordWa()}
  else if(D.anp){anP=D.anp;return render()}
  else if(D.ant){anT=D.ant;return render()}
  else if(D.edit){return editItem(+D.edit)}
  else if(D.dl){return dlFile(D.dl)}
  else if(D.gen){$("#code").value=String(Date.now()).slice(-9);return}
  else if(b.id==="goc"){return $("#cart").scrollIntoView({behavior:"smooth"})}
  else if(b.id==="pay"||b.id==="credit"){
    if(!S.cashier)return askName();const T=totals();if(!T.cnt)return;const cr=b.id==="credit",cu=S.cust.find(x=>x.id==custSel);if(cr&&!cu)return toast("اختار العميل الأول");
    T.L.forEach(l=>takeStrips(l.i,l.st?l.n:l.n*SPB(l.i)));
    S.sales.push({t:new Date().toISOString(),total:T.tot,profit:T.profit,by:S.cashier,disc:disc,cust:cr?cu.name:"",lines:T.L.map(l=>({id:l.i.id,name:l.i.name+(l.st?" ("+SUB(l.i)+")":""),q:l.n,price:lp(l),cost:lc(l),st:l.st?1:0}))});
    if(cr){cu.bal+=T.tot;cu.log.push({t:Date.now(),a:T.tot,n:"فاتورة"})}cart={};disc=0;save();render();return receipt(S.sales[S.sales.length-1]);
  }
  else if(b.id==="addi"){
    const n=$("#n").value.trim(),p=+$("#p").value,c=+$("#c").value,u=+$("#u").value,m=+$("#m").value,ex=$("#e").value;
    if(!n||!p||!ex)return toast("اكتب الاسم والسعر وتاريخ الصلاحية");
    const cd=$("#code").value.trim();
    if(cd&&S.items.some(x=>x.code===cd&&x.name!==n))return toast("الكود ده مسجل لصنف تاني");
    const sb=Math.max(1,+$("#sb").value||1),ssv=+$("#ss").value||(sb>1?Math.round(p/sb*2)/2:0);
    const same=S.items.find(x=>x.name===n&&x.price===p&&x.cost===c&&x.exp===ex&&SPB(x)===sb);
    if(same){same.qty+=u;if(cd&&!same.code)same.code=cd;save();return toast("الصنف موجود، اتزودت الكمية "+u+" (بقت "+same.qty+")")}
    const dup=S.items.some(x=>x.name===n);
    S.items.push({id:uid(),name:n,price:p,cost:c,qty:u,exp:ex,min:m,code:cd,spb:sb,sp:ssv,open:0,cat:$("#ct").value,sub:$("#su").value,mf:$("#mf").value.trim()});save();return toast(dup?"اتسجلت كدفعة جديدة (سعر أو صلاحية مختلفة)":"تم حفظ الصنف");
  }
  render();
});
render();
</script>
